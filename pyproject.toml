[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canprod"
version = "1.0.0"
description = "Reproducible Canadian production and productivity research with Statistics Canada data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "Alexander Mikhailov"}]
keywords = ["statistics-canada", "productivity", "economics", "cobb-douglas", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "matplotlib>=3.8,<4"]

[project.scripts]
canprod = "canprod.cli:main"

[tool.setuptools.package-data]
canprod = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["canprod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
